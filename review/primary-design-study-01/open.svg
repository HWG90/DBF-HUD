<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220"><style>.hud-label{font:11px Consolas,monospace;letter-spacing:.08em}.hud-count{font-family:Segoe UI,sans-serif;font-weight:600;letter-spacing:-.06em}.hud-mono{font-family:Consolas,monospace}.stroke{vector-effect:non-scaling-stroke}</style><title id="b-title">Open concept</title><desc id="b-desc">An unframed holographic readout. Large loaded count, a short magazine gauge, and a smaller reserve number.</desc>
<defs><filter id="open-shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#06191d" flood-opacity=".9"/></filter></defs>
<g filter="url(#open-shadow)">
<path d="M39 63 V49 H62 M297 168 V181 H274" fill="none" stroke="#a2d4d8" stroke-width="1.2" class="stroke"/>
<text x="56" y="61" fill="#b8d2d1" class="hud-label">AR-23</text>
<text id="b-count" x="49" y="141" font-size="89" fill="#ebfbf5" class="hud-count">27</text>
<text x="164" y="136" fill="#b0d2d1" font-size="20" class="hud-mono">/45</text>
<text id="b-reserve" x="246" y="119" fill="#c3e3dc" font-size="33" class="hud-count">6</text>
<text x="246" y="139" fill="#b8d2d1" class="hud-label">MAGS</text>
<path d="M56 157 H196" stroke="#405e60" stroke-width="3" class="stroke"/>
<path id="b-gauge" d="M56 157 H140" stroke="#aad7d3" stroke-width="3" class="stroke"/>
<path d="M56 153 V161 M91 154 V160 M126 154 V160 M161 154 V160 M196 153 V161" stroke="#1b3b41" class="stroke"/>
<text id="b-status" x="56" y="182" fill="#bbd5cf" class="hud-label">ROUNDS</text>
<text id="b-mode" x="246" y="170" fill="#b8d2d1" class="hud-label">AUTO</text>
</g>
</svg>
