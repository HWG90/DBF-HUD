<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220"><style>.hud-label{font:11px Consolas,monospace;letter-spacing:.08em}.hud-count{font-family:Segoe UI,sans-serif;font-weight:600;letter-spacing:-.06em}.hud-mono{font-family:Consolas,monospace}.stroke{vector-effect:non-scaling-stroke}</style><title id="c-title">Dial concept</title><desc id="c-desc">A circular loaded-ammunition instrument with a remaining-magazine arc and a smaller supply tab.</desc>
<defs><linearGradient id="dial-surface" x2=".6" y2="1"><stop stop-color="#29363c"/><stop offset="1" stop-color="#111a21"/></linearGradient></defs>
<path d="M206 81 H297 L317 101 V159 H206 Z" fill="#15212a" fill-opacity=".95" stroke="#7e9d9f" stroke-opacity=".5" class="stroke"/>
<circle cx="137" cy="112" r="78" fill="url(#dial-surface)" stroke="#80999b" stroke-opacity=".65" class="stroke"/>
<circle cx="137" cy="112" r="65" fill="none" stroke="#3c555d" stroke-width="5" class="stroke"/>
